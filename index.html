<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A polished, responsive calculator built with HTML, CSS, and JavaScript.">
    <meta name="author" content="Aditya Singh">
    <meta name="theme-color" content="#070b12" id="themeColor">
    <title>Calculator | Aditya Singh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css?v=6">
</head>
<body>
    <main class="app-shell">
        <section class="calculator" aria-label="Calculator">
            <header class="calculator-header">
                <div class="brand-block">
                    <div class="brand-mark" aria-hidden="true">+</div>
                    <div>
                        <p class="eyebrow">Utility</p>
                        <h1>Calculator</h1>
                    </div>
                </div>

                <div class="header-actions">
                    <span class="status-pill"><span class="status-dot" aria-hidden="true"></span>Ready</span>
                    <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Switch to light mode">
                        <span class="theme-option theme-sun" aria-hidden="true">☀</span>
                        <span class="theme-option theme-moon" aria-hidden="true">☾</span>
                        <span class="theme-thumb" aria-hidden="true"></span>
                    </button>
                </div>
            </header>

            <div class="display-shell" aria-live="polite">
                <div class="display-topline">
                    <span class="display-label">Display</span>
                    <span class="limit-badge">16 max</span>
                </div>
                <div class="display-expression" id="expression" aria-hidden="true"></div>
                <div class="display" id="display">0</div>
            </div>

            <div class="keys" aria-label="Calculator keys">
                <button class="key clear" type="button" data-action="clear" aria-label="Clear">AC</button>
                <button class="key utility" type="button" data-action="delete" aria-label="Delete last character">⌫</button>
                <button class="key operator" type="button" data-value="/" aria-label="Divide">÷</button>
                <button class="key operator" type="button" data-value="*" aria-label="Multiply">×</button>

                <button class="key" type="button" data-value="7">7</button>
                <button class="key" type="button" data-value="8">8</button>
                <button class="key" type="button" data-value="9">9</button>
                <button class="key operator" type="button" data-value="-" aria-label="Subtract">−</button>

                <button class="key" type="button" data-value="4">4</button>
                <button class="key" type="button" data-value="5">5</button>
                <button class="key" type="button" data-value="6">6</button>
                <button class="key operator" type="button" data-value="+" aria-label="Add">+</button>

                <button class="key" type="button" data-value="1">1</button>
                <button class="key" type="button" data-value="2">2</button>
                <button class="key" type="button" data-value="3">3</button>
                <button class="key equals" type="button" data-action="calculate" aria-label="Equals">=</button>

                <button class="key zero" type="button" data-value="0">0</button>
                <button class="key" type="button" data-value=".">.</button>
            </div>

            <footer class="calculator-footer">
                <span><kbd>⌨</kbd> Keyboard supported</span>
                <span><kbd>16</kbd> digit limit · <kbd>Esc</kbd> clear · <kbd>Enter</kbd> calculate</span>
            </footer>
        </section>
    </main>

    <script src="script.js?v=6"></script>
</body>
</html>
