<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, responsive calculator built with HTML, CSS, and JavaScript.">
    <meta name="author" content="Aditya Singh">
    <title>Calculator | Aditya Singh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main class="app-shell">
        <section class="calculator" aria-label="Calculator">
            <header class="calculator-header">
                <div>
                    <p class="eyebrow">Utility</p>
                    <h1>Calculator</h1>
                </div>
                <span class="status-pill">Ready</span>
            </header>

            <div class="display-shell" aria-live="polite">
                <span class="display-label">Result</span>
                <div class="display" id="display">0</div>
            </div>

            <div class="keys" aria-label="Calculator keys">
                <button class="key clear" type="button" data-action="clear" aria-label="Clear">AC</button>
                <button class="key utility" type="button" data-action="delete" aria-label="Delete last character">⌫</button>
                <button class="key operator" type="button" data-value="/" aria-label="Divide">÷</button>
                <button class="key operator" type="button" data-value="*" aria-label="Multiply">×</button>

                <button class="key" type="button" data-value="7">7</button>
                <button class="key" type="button" data-value="8">8</button>
                <button class="key" type="button" data-value="9">9</button>
                <button class="key operator" type="button" data-value="-" aria-label="Subtract">−</button>

                <button class="key" type="button" data-value="4">4</button>
                <button class="key" type="button" data-value="5">5</button>
                <button class="key" type="button" data-value="6">6</button>
                <button class="key operator" type="button" data-value="+" aria-label="Add">+</button>

                <button class="key" type="button" data-value="1">1</button>
                <button class="key" type="button" data-value="2">2</button>
                <button class="key" type="button" data-value="3">3</button>
                <button class="key equals" type="button" data-action="calculate" aria-label="Equals">=</button>

                <button class="key zero" type="button" data-value="0">0</button>
                <button class="key" type="button" data-value=".">.</button>
            </div>

            <footer class="calculator-footer">
                <span>Keyboard supported</span>
                <span>Esc clears · Enter calculates</span>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
